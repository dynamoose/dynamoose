name: CI
on:
  push:
  pull_request:
    types: [opened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/dynamoose/package-lock.json
            packages/dynamoose-logger/package-lock.json
            packages/dynamoose-utils/package-lock.json
      - run: npm ci
      - run: npm run lint
  test-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/dynamoose/package-lock.json
            packages/dynamoose-logger/package-lock.json
            packages/dynamoose-utils/package-lock.json
      - run: npm ci
      - run: npm run test:types
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [
          16.x,
          17.x,
          18.x,
          19.x,
          20.x,
          21.x,
          22.x,
          23.x,
          24.x,
          25.x
        ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/dynamoose/package-lock.json
            packages/dynamoose-logger/package-lock.json
            packages/dynamoose-utils/package-lock.json
      - run: npm ci
      - run: npm run build:sourcemap
      - name: Setup DynamoDB Local
        uses: rrainn/dynamodb-action@v2.0.0
      - name: Create coverage folder
        run: mkdir -p ./coverage
      - run: npm test
      - name: Coveralls
        uses: coverallsapp/github-action@1.1.3
        continue-on-error: true
        with:
          base-path: packages/dynamoose
          path-to-lcov: ./packages/dynamoose/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel: true
  benchmark-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v2
        with:
          path: head
          persist-credentials: false
      - name: Checkout base
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: |
            head/package-lock.json
            base/package-lock.json
      # npm ci also builds every package (root prepare script).
      - run: npm ci
        working-directory: head
      - run: npm ci
        working-directory: base
      - run: npm run benchmark:smoke
        working-directory: head/packages/dynamoose
      - name: Benchmark gate (pull request vs base)
        working-directory: head/packages/dynamoose
        env:
          BASELINE: ${{ github.workspace }}/base/packages/dynamoose
        run: npm run benchmark -- --gate --artifacts "$GITHUB_WORKSPACE/benchmark-gate"
      - name: Upload profiles of the slowdown
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gate
          path: benchmark-gate
          if-no-files-found: ignore
  finalize:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@1.1.3
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
